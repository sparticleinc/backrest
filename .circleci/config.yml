version: 2.1

# gbase-frontend-onprem の CircleCI の構成を踏襲している:
#   アーキテクチャごとのネイティブビルド（amd64 / arm64 をそれぞれのネイティブマシンで実行し、QEMU エミュレーションは不要）
#   → digest 単位で push（push-by-digest。-amd64/-arm64 の中間タグは作らない）
#   → 単一のマルチアーキテクチャタグ（manifest list）に統合
# CI（ビルド + docker.gbase.ai へのイメージ push）+ CD（main ブランチでイメージ統合後、SSH で上海サーバーへデプロイ）。
#
# CircleCI のプロジェクト環境変数に以下の設定が必要:
#   GBASE_USERNAME / GBASE_PASSWORD —— docker.gbase.ai のログイン認証情報（gptbasesparticle への push 権限が必要）
#   ONPREM_DEPLOY_SSH_HOST / ONPREM_DEPLOY_SSH_PORT / ONPREM_DEPLOY_SSH_USER —— 上海サーバーの SSH 接続情報
#   ONPREM_DEPLOY_SSH_KEY_FINGERPRINT —— CircleCI のプロジェクト設定 → SSH Keys で秘密鍵を登録した際に表示される MD5 フィンガープリント

jobs:
  # 基本チェック: フロントエンドの型チェック + Go ビルド（全ブランチ）
  check:
    docker:
      - image: cimg/go:1.26-node
    resource_class: medium
    steps:
      - checkout
      - run:
          name: フロントエンドの依存関係インストールと型チェック
          command: |
            # cimg イメージは root ではない circleci ユーザーで動くが、corepack の shim は
            # node のある /usr/local/bin（root 所有で、イメージには pnpm が同梱済み）に書き込むため、
            # sudo を付けないと EACCES: permission denied, unlink '/usr/local/bin/pnpm' になる。
            # 有効化するのは pnpm の shim だけで、npm/yarn には触れない。
            sudo corepack enable pnpm
            corepack prepare pnpm@10 --activate
            cd webui
            pnpm install --frozen-lockfile
            pnpm run check
            pnpm run build
      - run:
          name: Go ビルド
          command: |
            CGO_ENABLED=0 go build -tags tray ./cmd/backrest
            CGO_ENABLED=0 go build ./cmd/docker-entrypoint

  # 全ジョブ共通の一意なイメージタグ（YYYYMMDDHHMMSS、Asia/Tokyo）を生成し、各アーキテクチャと統合ジョブで共有するため永続化する
  prepare:
    docker:
      - image: cimg/base:current
    resource_class: small
    working_directory: /tmp/workspace
    steps:
      - run:
          name: 共有イメージタグの生成
          command: |
            IMAGE_TAG=$(TZ='Asia/Tokyo' date +%Y%m%d%H%M%S)
            mkdir -p /tmp/workspace
            echo "$IMAGE_TAG" > /tmp/workspace/IMAGE_TAG
            echo "Generated shared IMAGE_TAG: $IMAGE_TAG"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - IMAGE_TAG

  # 単一アーキテクチャ: ネイティブアーキテクチャのマシンでソースからビルドし、digest 単位で push する
  docker-build-push-arch:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: << parameters.resource-class >>
    parameters:
      repo:
        type: string
      dockerfile:
        type: string
      arch:
        type: string
      resource-class:
        type: string
    working_directory: /tmp/workspace
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: イメージレジストリへのログイン
          command: |
            echo "$GBASE_PASSWORD" | docker login docker.gbase.ai -u "$GBASE_USERNAME" --password-stdin
      - run:
          name: digest 単位でビルドして push（アーキテクチャ別タグは作らない）
          command: |
            BACKREST_BUILD_VERSION=$(cat /tmp/workspace/IMAGE_TAG)
            # push-by-digest に対応した buildx の container ドライバーを使う:
            # イメージの中身だけを digest 単位でレジストリへ push し、-amd64/-arm64 タグは一切作らない
            docker buildx create --use --name multiarch >/dev/null 2>&1 || docker buildx use multiarch
            docker buildx build \
              -f << parameters.dockerfile >> \
              --build-arg BACKREST_BUILD_VERSION="$BACKREST_BUILD_VERSION" \
              --output "type=image,name=<< parameters.repo >>,push-by-digest=true,push=true" \
              --metadata-file /tmp/metadata.json \
              .
            DIGEST=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
            echo "このアーキテクチャのイメージ digest: $DIGEST"
            mkdir -p /tmp/workspace/digests
            echo "$DIGEST" > /tmp/workspace/digests/<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - digests

  # マルチアーキテクチャのマニフェスト統合: 2 アーキテクチャの digest を共通タグにまとめる（pull 時に実行環境のアーキテクチャが自動選択される）
  docker-manifest-merge:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    parameters:
      repo:
        type: string
      deploy:
        type: boolean
        default: false
    working_directory: /tmp/workspace
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: マルチアーキテクチャイメージを共通のタイムスタンプタグに統合
          command: |
            echo "$GBASE_PASSWORD" | docker login docker.gbase.ai -u "$GBASE_USERNAME" --password-stdin
            BASE_TAG=$(cat /tmp/workspace/IMAGE_TAG)
            AMD_DIGEST=$(cat /tmp/workspace/digests/amd64)
            ARM_DIGEST=$(cat /tmp/workspace/digests/arm64)
            echo "export BASE_TAG=$BASE_TAG" >> $BASH_ENV
            echo "BASE_TAG=$BASE_TAG amd64=$AMD_DIGEST arm64=$ARM_DIGEST"
            docker buildx imagetools create \
              -t << parameters.repo >>:${BASE_TAG} \
              << parameters.repo >>@${AMD_DIGEST} \
              << parameters.repo >>@${ARM_DIGEST}
            docker buildx imagetools inspect << parameters.repo >>:${BASE_TAG}
      - when:
          # deploy=true かつ現在のブランチが main の場合のみ CD を実行する
          condition:
            and:
              - << parameters.deploy >>
              - equal: [ main, << pipeline.git.branch >> ]
          steps:
            # CircleCI のプロジェクト設定 → SSH Keys に事前登録した秘密鍵を ssh-agent に読み込む
            # ONPREM_DEPLOY_SSH_KEY_FINGERPRINT は秘密鍵の登録後に CircleCI が表示する MD5 フィンガープリント
            - add_ssh_keys:
                fingerprints:
                  - "$ONPREM_DEPLOY_SSH_KEY_FINGERPRINT"
            - run:
                name: SSH で上海サーバーへデプロイ（backrest イメージを更新して再起動）
                command: |
                  # 初回接続時の対話確認を避けるため、サーバーの公開鍵を known_hosts に書き込む
                  mkdir -p ~/.ssh
                  ssh-keyscan -H -p "$ONPREM_DEPLOY_SSH_PORT" "$ONPREM_DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

                  # デプロイには統合後の単一タグ BASE_TAG（マルチアーキテクチャ manifest）を使い、サーバーは自身のアーキテクチャに合うものを自動で pull する
                  # - ローカルの shell で $BASE_TAG を展開し、リモートコマンドのプレフィックスを組み立てる
                  # - heredoc は 'REMOTE' のシングルクォート形式にして、スクリプト本体がローカルで再展開されないようにする
                  # - sed で backrest の image 行を丸ごと置き換える（任意のレジストリプレフィックス・タグ形式に対応）
                  ssh -p "$ONPREM_DEPLOY_SSH_PORT" "$ONPREM_DEPLOY_SSH_USER@$ONPREM_DEPLOY_SSH_HOST" \
                    "IMAGE_TAG='$BASE_TAG' bash -s" \<<'REMOTE'
                  set -euo pipefail
                  cd gbase_onprem
                  echo "更新前の backrest イメージ行:"
                  grep -E '^[[:space:]]*image:[[:space:]]*[^#[:space:]]*backrest:[0-9]' docker-compose.yml || true
                  sed -i -E "s|^([[:space:]]*)image:[[:space:]]*[^#[:space:]]*backrest:[0-9][^[:space:]]*|\1image: docker.gbase.ai/gptbasesparticle/backrest:${IMAGE_TAG}|" docker-compose.yml
                  echo "更新後の backrest イメージ行:"
                  grep -E "^[[:space:]]*image:[[:space:]]*docker\.gbase\.ai/gptbasesparticle/backrest:${IMAGE_TAG}" docker-compose.yml
                  docker compose down backrest
                  docker compose up backrest -d
                  REMOTE

workflows:
  ci:
    jobs:
      - check
      # main ブランチのみイメージをビルドして push する
      - prepare:
          filters:
            branches:
              only:
                - main
      - docker-build-push-arch:
          name: docker-build-push-amd64
          repo: docker.gbase.ai/gptbasesparticle/backrest
          dockerfile: Dockerfile
          arch: amd64
          resource-class: medium
          filters:
            branches:
              only:
                - main
          requires:
            - check
            - prepare
      - docker-build-push-arch:
          name: docker-build-push-arm64
          repo: docker.gbase.ai/gptbasesparticle/backrest
          dockerfile: Dockerfile
          arch: arm64
          resource-class: arm.medium
          filters:
            branches:
              only:
                - main
          requires:
            - check
            - prepare
      - docker-manifest-merge:
          name: docker-manifest-merge
          repo: docker.gbase.ai/gptbasesparticle/backrest
          deploy: true
          filters:
            branches:
              only:
                - main
          requires:
            - docker-build-push-amd64
            - docker-build-push-arm64
